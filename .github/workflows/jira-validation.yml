name: Jira Validation

on:
  repository_dispatch:
    types:
      - jira_validation

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Show Validation Payload
        run: |
          echo "Status : ${{ github.event.client_payload.status }}"
          echo "Issue  : ${{ github.event.client_payload.issue_key }}"
          echo "Message: ${{ github.event.client_payload.message }}"

      - name: Evaluate Validation
        run: |
          STATUS="${{ github.event.client_payload.status }}"

          echo "Status = $STATUS"

          if [ "$STATUS" = "FAIL" ]; then
            echo "Validation Failed"
            exit 1
          fi

          if [ "$STATUS" = "SKIP" ]; then
            echo "Validation Skipped"
            exit 0
          fi

          echo "Validation Passed"